# 服务编排
services:
  # 交易数据与预测结果存储
  postgres:
    image: postgres:18.6
    # 固定容器名
    container_name: fincross-postgres
    # 异常自动重启
    restart: unless-stopped
    # 加载环境变量
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 本机调试端口
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      # 持久化数据
      - postgres_data:/var/lib/postgresql
      # 挂载初始化脚本
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    # 数据库就绪检查
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fincross-net]

  # Worker 完成标记存储
  redis:
    image: redis:8.10.1
    container_name: fincross-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # 开启 AOF 持久化
    command: ["redis-server", "--appendonly", "yes"]
    # Redis 就绪检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [fincross-net]

  # 异步任务消息队列
  kafka:
    # Apache Kafka 官方镜像
    image: apache/kafka:4.3.1
    container_name: fincross-kafka
    restart: unless-stopped
    # 宿主机调试端口
    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"
    # Kafka 运行参数
    environment:
      # 节点编号（node.id）
      KAFKA_NODE_ID: 1
      # 节点角色（process.roles）
      KAFKA_PROCESS_ROLES: broker,controller
      # 控制器（controller.quorum.voters）
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 监听地址和端口（listeners）
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      # 客户端连接地址（advertised.listeners）
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT}
      # 协议映射（listener.security.protocol.map）
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Broker 通信 listener（inter.broker.listener.name）
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Controller listener（controller.listener.names）
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Offset 主题副本数（offsets.topic.replication.factor）
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 默认分区数（num.partitions）
      KAFKA_NUM_PARTITIONS: 3
      # 消息日志目录（log.dirs）
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    # Kafka 就绪检查
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [fincross-net]

  # 交易接收与任务发布
  data-service:
    build: ./apps/data-service
    container_name: fincross-data-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATA_SERVICE_PORT}:8000"
    environment:
      # 使用服务名连接数据库
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 使用容器内监听器
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: transaction-analysis
    # 应用就绪检查
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [fincross-net]

  # 模型加载与推理服务
  model-service:
    build: ./apps/model-service
    container_name: fincross-model-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MODEL_SERVICE_PORT}:8000"
    environment:
      # 模型文件路径
      MODEL_PATH: /models/model.pkl
      MODEL_VERSION: ${MODEL_VERSION}
    volumes:
      # 只读挂载模型
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [fincross-net]

  # 消费任务并写回结果
  worker:
    build: ./apps/worker
    container_name: fincross-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Redis 服务地址
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: transaction-analysis
      # 模型服务地址
      MODEL_SERVICE_URL: http://model-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      model-service:
        condition: service_healthy
    networks: [fincross-net]

  # 对外统一入口
  gateway:
    build: ./apps/gateway
    container_name: fincross-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:8000"
    environment:
      # 数据服务地址
      DATA_SERVICE_URL: http://data-service:8000
    depends_on:
      data-service:
        condition: service_healthy
    networks: [fincross-net]

# 持久化卷定义
volumes:
  postgres_data:
  redis_data:
  kafka_data:

# 自定义服务网络
networks:
  fincross-net: {}